name: Update Top Languages
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          filename: top-langs.svg
